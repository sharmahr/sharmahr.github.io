<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Hardik Sharma">
<meta name="theme-color" content="#0b0a09">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/images/Hardik_Sharma.jpeg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap">

<script>
  (function () {
    var d = document.documentElement;
    d.classList.add("js");
    try {
      /* Dark is the design, not a fallback. Only an explicit choice
         stored by the visitor is allowed to override it. */
      var s = localStorage.getItem("hs-theme");
      if (s === "light" || s === "dark") d.setAttribute("data-theme", s);
    } catch (e) {}

    /* If React never hydrates, the prerendered markup is still here but
       Framer Motion's initial styles have it at opacity 0. Release it. */
    setTimeout(function () {
      if (!window.__hsReady) d.classList.add("hydration-stalled");
    }, 3500);
  })();
</script>

<noscript><style>
  [data-reveal] { opacity: 1 !important; transform: none !important; filter: none !important; }
  .timeline__line { transform: scaleY(1) !important; }
  .job__node { transform: rotate(45deg) scale(1) !important; }
</style></noscript>
</head>

<body>
<div id="root"><!--app-html--></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
